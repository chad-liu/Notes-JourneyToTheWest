<svg viewBox="0 0 1000 760" width="1500" height="1140" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d3b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#faf6ee"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#3a2c1a">西遊記天界地點示意關係圖</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#8a7a5c">四大界域與孫悟空鬧天宮路線示意（非實際地理位置）</text>

  <!-- ===== 天界 band ===== -->
  <rect x="40" y="90" width="920" height="230" rx="14" fill="#eaf1fb" stroke="#9fb8dd" stroke-width="1.5"/>
  <text x="60" y="118" font-size="16" font-weight="700" fill="#2d4a75">天界</text>

  <!-- 南天門 -->
  <rect x="80" y="140" width="150" height="60" rx="10" fill="#ffffff" stroke="#6d8fc2" stroke-width="1.5"/>
  <text x="155" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#2d4a75">南天門</text>
  <text x="155" y="184" text-anchor="middle" font-size="11" fill="#5a6b8a">天庭入口關卡</text>

  <!-- 凌霄寶殿 -->
  <rect x="270" y="140" width="160" height="60" rx="10" fill="#ffffff" stroke="#6d8fc2" stroke-width="1.5"/>
  <text x="350" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#2d4a75">凌霄寶殿</text>
  <text x="350" y="184" text-anchor="middle" font-size="11" fill="#5a6b8a">玉皇大帝・天庭中樞</text>

  <!-- 蟠桃園瑤池 -->
  <rect x="470" y="140" width="160" height="60" rx="10" fill="#ffffff" stroke="#6d8fc2" stroke-width="1.5"/>
  <text x="550" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#2d4a75">蟠桃園瑤池</text>
  <text x="550" y="184" text-anchor="middle" font-size="11" fill="#5a6b8a">王母娘娘・蟠桃盛會</text>

  <!-- 兜率宮 -->
  <rect x="670" y="140" width="160" height="60" rx="10" fill="#ffffff" stroke="#6d8fc2" stroke-width="1.5"/>
  <text x="750" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#2d4a75">兜率宮</text>
  <text x="750" y="184" text-anchor="middle" font-size="11" fill="#5a6b8a">太上老君・煉丹八卦爐</text>

  <!-- 廣寒宮 -->
  <rect x="80" y="240" width="150" height="60" rx="10" fill="#ffffff" stroke="#6d8fc2" stroke-width="1.5"/>
  <text x="155" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#2d4a75">廣寒宮</text>
  <text x="155" y="284" text-anchor="middle" font-size="11" fill="#5a6b8a">嫦娥、玉兔精・月宮</text>

  <!-- flow arrows within heaven -->
  <path d="M230,170 L270,170" stroke="#8a6d3b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M430,170 L470,170" stroke="#8a6d3b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M630,170 L670,170" stroke="#8a6d3b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- ===== 靈山／西天 (top right small box outside heaven, final destination) ===== -->
  <rect x="820" y="330" width="150" height="60" rx="10" fill="#fff2e0" stroke="#d99a3f" stroke-width="1.5"/>
  <text x="895" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4d10">靈山(大雷音寺)</text>
  <text x="895" y="374" text-anchor="middle" font-size="11" fill="#8a6a35">如來佛祖・取經終點</text>

  <!-- ===== 人間 band ===== -->
  <rect x="40" y="410" width="440" height="120" rx="14" fill="#eef6ea" stroke="#9dc48e" stroke-width="1.5"/>
  <text x="60" y="438" font-size="16" font-weight="700" fill="#3a6b2a">人間仙山</text>
  <rect x="80" y="455" width="170" height="60" rx="10" fill="#ffffff" stroke="#7fae6d" stroke-width="1.5"/>
  <text x="165" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6b2a">花果山水簾洞</text>
  <text x="165" y="499" text-anchor="middle" font-size="11" fill="#5a7a4a">孫悟空出生・稱王之地</text>

  <rect x="290" y="455" width="170" height="60" rx="10" fill="#ffffff" stroke="#7fae6d" stroke-width="1.5"/>
  <text x="375" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6b2a">南海普陀山</text>
  <text x="375" y="499" text-anchor="middle" font-size="11" fill="#5a7a4a">觀音菩薩道場</text>

  <!-- ===== 海底 band ===== -->
  <rect x="520" y="410" width="220" height="120" rx="14" fill="#e8f3f6" stroke="#7fb4c2" stroke-width="1.5"/>
  <text x="540" y="438" font-size="16" font-weight="700" fill="#1f5a6b">海底仙宮</text>
  <rect x="555" y="455" width="150" height="60" rx="10" fill="#ffffff" stroke="#5a9aac" stroke-width="1.5"/>
  <text x="630" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5a6b">東海龍宮</text>
  <text x="630" y="499" text-anchor="middle" font-size="11" fill="#3a7a8a">敖廣・水晶宮取金箍棒</text>

  <!-- ===== 幽冥 band ===== -->
  <rect x="780" y="410" width="180" height="120" rx="14" fill="#f2eaf0" stroke="#b98cae" stroke-width="1.5"/>
  <text x="800" y="438" font-size="16" font-weight="700" fill="#6b2f5c">幽冥地界</text>
  <rect x="800" y="455" width="140" height="60" rx="10" fill="#ffffff" stroke="#a06694" stroke-width="1.5"/>
  <text x="870" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2f5c">森羅地府</text>
  <text x="870" y="499" text-anchor="middle" font-size="11" fill="#8a4a7a">十殿閻羅・生死簿</text>

  <!-- ===== 孫悟空鬧天宮路線 legend + path ===== -->
  <text x="60" y="575" font-size="16" font-weight="700" fill="#3a2c1a">孫悟空歷程路線（示意順序）</text>

  <!-- path arrows connecting the story sequence -->
  <path d="M165,455 C165,400 630,430 630,455" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,455 C630,400 870,430 870,455" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M870,455 C870,350 350,250 350,200" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M550,200 C550,260 750,260 750,200" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M750,200 C900,260 950,300 895,330" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- step labels -->
  <g font-size="12" fill="#7a3428">
    <text x="330" y="425">① 花果山稱王</text>
    <text x="700" y="425">② 東海借兵器</text>
    <text x="750" y="425" text-anchor="end">③ 地府勾生死簿</text>
    <text x="560" y="230">④ 受招安、大鬧蟠桃會</text>
    <text x="770" y="230">⑤ 兜率宮煉丹爐</text>
    <text x="920" y="310" text-anchor="end">⑥ 最終・靈山取經正果</text>
  </g>

  <!-- legend box -->
  <rect x="600" y="565" width="360" height="90" rx="10" fill="#ffffff" stroke="#c9bfa8" stroke-width="1"/>
  <text x="618" y="588" font-size="12" fill="#5a4a30" font-weight="700">說明</text>
  <text x="618" y="608" font-size="11" fill="#6a5a40">四色色塊代表故事中的四大界域，彼此並無</text>
  <text x="618" y="626" font-size="11" fill="#6a5a40">實際地理座標關係，此圖僅為概念示意。</text>
  <text x="618" y="644" font-size="11" fill="#6a5a40">紅色路線為孫悟空鬧天宮的故事發展順序。</text>
</svg>
